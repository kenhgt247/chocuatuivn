<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Chợ Của Tui – Cộng đồng chia sẻ miễn phí</title>
    <meta name="description" content="Có gì chia sẻ, cần gì có nhau. Cho tặng, mượn đồ, giúp nhau và sửa đồ gần nhà, hoàn toàn miễn phí." />
    
    <meta property="og:title" content="Chợ Của Tui – Cộng đồng chia sẻ miễn phí" />
    <meta property="og:description" content="Cho tặng, mượn đồ, giúp nhau và sửa đồ miễn phí trong cộng đồng Việt." />
    <meta property="og:image" content="https://www.chocuatui.vn/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chợ Của Tui" />
    
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Be Vietnam Pro', sans-serif;
        background-color: #f7faf8;
        color: #111827;
        overscroll-behavior-y: none;
        width: 100vw;
        height: 100dvh;
        overflow-x: hidden;
      }

      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%);
        padding-bottom: 50px;
      }

      .logo-box {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(4, 120, 87, 0.35);
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
      }

      .logo-box img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .app-name {
        font-family: 'Be Vietnam Pro', sans-serif;
        font-weight: 900;
        font-size: 20px;
        color: #064e3b;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }

      .loading-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #d1fae5;
        border-top-color: #047857;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="logo-box">
          <img src="/icons/icon-192.png" alt="" />
        </div>
        <div class="app-name">CHỢ CỦA TUI</div>
        <div style="font-size:13px;color:#047857;margin-bottom:16px">Có gì chia sẻ, cần gì có nhau</div>
        <div class="loading-spinner"></div>
      </div>
    </div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
