<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Chợ Của Tui – Cộng đồng chia sẻ miễn phí</title>
    <meta name="description" content="Có gì chia sẻ, cần gì có nhau. Cho tặng, mượn đồ, giúp nhau và sửa đồ gần nhà, hoàn toàn miễn phí." />
    
    <meta property="og:title" content="Chợ Của Tui – Cộng đồng chia sẻ miễn phí" />
    <meta property="og:description" content="Cho tặng, mượn đồ, giúp nhau và sửa đồ miễn phí trong cộng đồng Việt." />
    <meta property="og:image" content="https://www.chocuatui.vn/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1F6F43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chợ Của Tui" />
    
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Mở sẵn kết nối tới nơi chứa ảnh và dữ liệu -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <!-- Trang chủ: tải danh sách tin ngay, song song với mã JavaScript -->
    <script>
      (function () {
        var p = location.pathname;
        if (p === '/' || p === '/cong-dong' || p === '/cong-dong/') {
          try {
            var u = '/api/feed';
            try { u = localStorage.getItem('ccut-feed-scope') || u; } catch (e) {}
            if (u.indexOf('/api/feed') !== 0) u = '/api/feed';
            window.__feed = { url: u, p: fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }) };
          } catch (e) {}
        }
      })();
    </script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Be Vietnam Pro', sans-serif;
        background-color: #FBF7EE;
        color: #1D2A22;
        overscroll-behavior-y: none;
        width: 100vw;
        height: 100dvh;
        overflow-x: hidden;
      }

      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      /* Màn hình chờ: khung xám đúng vị trí trang chủ thay cho vòng quay */
      .sk-wrap { max-width: 1152px; margin: 0 auto; padding: 14px 20px; }
      .sk-head { display: flex; align-items: center; gap: 10px; }
      .sk-head img { width: 40px; height: 40px; border-radius: 12px; }
      .sk-name { font-weight: 800; font-size: 18px; color: #123524; }
      .sk { background: #ECE5D4; border-radius: 10px; position: relative; overflow: hidden; }
      .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
        animation: sk-shine 1.4s infinite; }
      @keyframes sk-shine { to { transform: translateX(100%); } }
      .sk-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .sk-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
      .sk-note { text-align: center; color: #1F6F43; font-weight: 700; font-size: 14px; margin-top: 18px; }
      .sk-sub { text-align: center; color: #56645A; font-size: 12px; margin-top: 4px; }
      @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk-wrap" aria-busy="true" aria-label="Đang tải">
        <div class="sk-head"><img src="/icons/icon-192.png" alt="" /><span class="sk-name">Chợ Của Tui</span></div>
        <div class="sk" style="height:28px;width:60%;margin:22px 0 14px"></div>
        <div class="sk-grid2"><div class="sk" style="height:88px;border-radius:20px"></div><div class="sk" style="height:88px;border-radius:20px"></div></div>
        <div class="sk-grid4" style="margin-top:14px"><div class="sk" style="height:66px;border-radius:14px"></div><div class="sk" style="height:66px;border-radius:14px"></div><div class="sk" style="height:66px;border-radius:14px"></div><div class="sk" style="height:66px;border-radius:14px"></div></div>
        <div class="sk" style="height:18px;width:30%;margin:20px 0 12px"></div>
        <div class="sk-grid2"><div class="sk" style="height:180px;border-radius:16px"></div><div class="sk" style="height:180px;border-radius:16px"></div></div>
        <p class="sk-note">Đang tìm tin quanh bạn…</p>
        <p class="sk-sub">Có gì chia sẻ, cần gì có nhau</p>
      </div>
    </div>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
